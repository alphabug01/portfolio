name: Supabase keep-alive

# Free Supabase projects are paused after about a week without activity.
# This sends one small read to the database every day so the project stays awake.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY
# (the same values as VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in .env).

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the portfolio schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing the SUPABASE_URL or SUPABASE_ANON_KEY repository secret"
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 \
            --retry 3 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            "$SUPABASE_URL/rest/v1/projects?select=slug&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept-Profile: portfolio")
          echo "Supabase responded with HTTP $status"
          [ "$status" = "200" ]
